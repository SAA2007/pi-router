# /etc/hostapd/hostapd.conf  - 5 GHz, 40 MHz, WPA2
# country_code decides which channels are legal. Check with: iw reg get
# Pakistan allows 5 GHz channels 149-165 only (not 36-48).
interface=wlan0
country_code=PK
ieee80211d=1
ssid=YourNetwork
hw_mode=a
channel=149
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-40]
vht_oper_chwidth=0
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# 12+ characters (shorter 8-character passwords make Windows ask for a "PIN")
wpa_passphrase=CHANGE-ME-12-OR-MORE-CHARACTERS
